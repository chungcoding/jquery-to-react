<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>탭 - jQuery 원본</title>
  <style>
    /* ① 노션에 CSS가 있으면 여기에 붙여 넣기 */
    .tab_con { display: none; }
    .tab_con.on { display: block; }
    .tab li.on { font-weight: bold; }
  </style>
</head>
<body>

  <!-- ② 노션의 탭 HTML을 여기에 붙여 넣기 -->
  <ul class="tab">
    <li class="on">탭 1</li>
    <li>탭 2</li>
    <li>탭 3</li>
  </ul>
  <div class="tab_con on">내용 1</div>
  <div class="tab_con">내용 2</div>
  <div class="tab_con">내용 3</div>


  <script>
    var tabs = document.querySelectorAll('.tab li');
    var cons = document.querySelectorAll('.tab_con');

    tabs.forEach(function (tab, idx) {
      // tab = 지금 돌고 있는 li 하나, idx = 그 li의 번호 (0, 1, 2)

      tab.addEventListener('click', function () {

        // 1단계: 모든 탭에서 on 빼기
        tabs.forEach(function (t) {
          t.classList.remove('on');
        });

        // 2단계: 모든 탭 내용에서 on 빼기
        cons.forEach(function (c) {
          c.classList.remove('on');
        });

        // 3단계: 클릭한 탭에만 on 넣기
        tab.classList.add('on');

        // 4단계: 같은 번호의 탭 내용에만 on 넣기
        cons[idx].classList.add('on');
      });
    });
  </script>

</body>
</html>
